name: Build Mod

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build (Windows)
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Cache Geode SDK
        uses: actions/cache@v4
        with:
          path: ~/.geode
          key: geode-sdk-${{ runner.os }}

      - name: Install Geode CLI
        run: |
          $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/geode-sdk/cli/releases/latest"
          $tag = $rel.tag_name
          $asset = $rel.assets | Where-Object { $_.name -like "*-win.zip" } | Select-Object -First 1
          Write-Host "Downloading Geode CLI $tag : $($asset.name)"
          $zip = "$env:TEMP\geode-cli.zip"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
          $outDir = "$env:LOCALAPPDATA\geode-cli"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          Expand-Archive -Path $zip -DestinationPath $outDir -Force
          echo "$outDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup Geode profile
        run: |
          $gdDir = "$env:LOCALAPPDATA\GeometryDashCI"
          New-Item -ItemType Directory -Path $gdDir -Force | Out-Null
          geode profile add --name ci $gdDir

      - name: Install Geode SDK
        run: |
          geode sdk install
          geode sdk install-binaries

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config RelWithDebInfo

      - name: Package
        working-directory: build
        run: geode package .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lock-music-arrow-windows
          path: build/*.geode
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.geode
          generate_release_notes: true
